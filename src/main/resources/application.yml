spring:
  application:
    name: quickpay

  datasource:
    url: jdbc:h2:mem:quickpay
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: always

server:
  port: 8081

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: quickpay-secret-key-for-jwt-token-generation-2024
  expiration: 86400000

service:
  internal-key: fintech-internal-service-key-2024

logging:
  level:
    com.fintech.quickpay: DEBUG
